{# Expects: boq. Optional: detail_tab (defaults to detail without ?tab=). #}
<div class="list-actions">
    <a
        href="{% url 'boq:detail' boq.pk %}{% if detail_tab %}?tab={{ detail_tab }}{% endif %}"
        class="topbar-view"
        aria-label="View {{ boq.boq_name }}"
        title="View"
    >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </a>
    <form
        method="post"
        action="{% url 'boq:delete' boq.pk %}"
        class="inline-form"
        data-confirm="Delete BOQ '{{ boq.boq_name }}'? This permanently removes the workbook, make list, analysis files, and job progress. This cannot be undone."
        onsubmit="return window.BOQConfirm ? window.BOQConfirm.submit(event, this) : confirm(this.getAttribute('data-confirm'));"
    >
        {% csrf_token %}
        <button type="submit" class="topbar-delete" aria-label="Delete BOQ {{ boq.boq_name }}" title="Delete">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
        </button>
    </form>
</div>
