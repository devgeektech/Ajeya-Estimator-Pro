{% extends "base.html" %}
{% block title %}{{ title }} &middot; Ajeya Estimator Pro{% endblock %}
{% block heading %}{{ title }}{% endblock %}

{% block content %}
<div class="panel panel--narrow">
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <label class="field">
            <span class="field__label">{{ field.label }}{% if field.field.required %}<span class="field__required" aria-hidden="true">*</span>{% endif %}</span>
            {% if field.name == "password1" or field.name == "password2" %}
            <div class="password-wrap">
                {{ field }}
                <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1" aria-label="Toggle password visibility">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>
            {% if field.name == "password1" %}
            <div class="pwd-requirements" id="pwd-requirements">
                <div class="pwd-req-title">Password Requirements</div>
                <div class="pwd-rule" id="rule-length">
                    <span class="rule-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
                    <span>At least 6 characters</span>
                </div>
                <div class="pwd-rule" id="rule-letter">
                    <span class="rule-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
                    <span>At least one letter (a-z, A-Z)</span>
                </div>
                <div class="pwd-rule" id="rule-number">
                    <span class="rule-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
                    <span>At least one number (0-9)</span>
                </div>
                <div class="pwd-rule" id="rule-symbol">
                    <span class="rule-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
                    <span>At least one special symbol (@, #, $, %, etc.)</span>
                </div>
                <div class="pwd-rule" id="rule-match" style="display: none;">
                    <span class="rule-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
                    <span>Passwords match</span>
                </div>
            </div>
            {% endif %}
            {% else %}
            {{ field }}
            {% endif %}
            {% for error in field.errors %}<span class="field__error">{{ error }}</span>{% endfor %}
            {% if field.help_text and field.name != "password1" %}<span class="field__help">{{ field.help_text }}</span>{% endif %}
        </label>
        {% endfor %}
        <div class="form-actions">
            <a href="{% url 'users:list' %}" class="btn btn--ghost">Cancel</a>
            <button type="submit" class="btn btn--primary">Save</button>
        </div>
    </form>
</div>

<style>
.password-wrap { position: relative; }
.password-wrap .form-control { padding-right: 42px; }
.pwd-eye {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted, #64748b);
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .15s;
}
.pwd-eye:hover { color: var(--primary, #2563eb); }

/* Real-time Checklist Styles */
.pwd-requirements {
    margin: 6px 0 12px;
    padding: 12px 14px;
    background: var(--surface-alt, #f8fafc);
    border: 1px solid var(--border, #e2e8f0);
    border-radius: 8px;
    font-size: 0.82rem;
}
.pwd-req-title {
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text, #1e293b);
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.pwd-rule {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
    color: var(--text-muted, #64748b);
    transition: color .15s ease, font-weight .15s ease;
}
.pwd-rule.valid {
    color: var(--green, #16a34a) !important;
    font-weight: 500 !important;
}
.pwd-rule.invalid {
    color: var(--red, #dc2626) !important;
    font-weight: 500 !important;
}
.rule-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
</style>

<script>
function togglePwd(btn) {
    const wrap = btn.closest('.password-wrap');
    const input = wrap.querySelector('input');
    const open = btn.querySelector('.eye-open');
    const closed = btn.querySelector('.eye-closed');
    if (input.type === 'password') {
        input.type = 'text';
        open.style.display = 'none';
        closed.style.display = '';
    } else {
        input.type = 'password';
        open.style.display = '';
        closed.style.display = 'none';
    }
}

function initPasswordValidator(pwdId, confirmId) {
    const pwdInput = document.getElementById(pwdId);
    const confirmInput = document.getElementById(confirmId);
    const reqBox = document.getElementById('pwd-requirements');
    if (!pwdInput || !reqBox) return;

    const ruleLength = reqBox.querySelector('#rule-length');
    const ruleLetter = reqBox.querySelector('#rule-letter');
    const ruleNumber = reqBox.querySelector('#rule-number');
    const ruleSymbol = reqBox.querySelector('#rule-symbol');
    const ruleMatch = reqBox.querySelector('#rule-match');

    const checkSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const circleSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>';
    const crossSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

    function updateRule(el, isValid, isFailed) {
        if (!el) return;
        const icon = el.querySelector('.rule-icon');
        if (isValid) {
            el.className = 'pwd-rule valid';
            if (icon) icon.innerHTML = checkSvg;
        } else if (isFailed) {
            el.className = 'pwd-rule invalid';
            if (icon) icon.innerHTML = crossSvg;
        } else {
            el.className = 'pwd-rule';
            if (icon) icon.innerHTML = circleSvg;
        }
    }

    function check() {
        const val = pwdInput.value || '';
        updateRule(ruleLength, val.length >= 6);
        updateRule(ruleLetter, /[a-zA-Z]/.test(val));
        updateRule(ruleNumber, /\d/.test(val));
        updateRule(ruleSymbol, /[^a-zA-Z0-9\s]/.test(val));

        if (confirmInput && ruleMatch) {
            const cVal = confirmInput.value || '';
            if (cVal.length > 0) {
                ruleMatch.style.display = 'flex';
                if (cVal === val && val.length > 0) {
                    updateRule(ruleMatch, true, false);
                } else {
                    updateRule(ruleMatch, false, true);
                }
            } else {
                ruleMatch.style.display = 'none';
            }
        }
    }

    pwdInput.addEventListener('input', check);
    pwdInput.addEventListener('focus', check);
    if (confirmInput) {
        confirmInput.addEventListener('input', check);
        confirmInput.addEventListener('focus', check);
    }
    check();
}

document.addEventListener('DOMContentLoaded', function () {
    initPasswordValidator('id_password1', 'id_password2');

    const role = document.querySelector('[name="role"]');
    const dbAccess = document.querySelector('[name="allow_db_access"]');
    if (!role || !dbAccess) return;

    const syncDbAccess = () => {
        const isAdmin = role.value === 'ADMIN';
        dbAccess.checked = isAdmin || dbAccess.checked;
        dbAccess.disabled = isAdmin;
    };

    syncDbAccess();
    role.addEventListener('change', syncDbAccess);
    dbAccess.closest('form')?.addEventListener('submit', () => {
        dbAccess.disabled = false;
        if (role.value === 'ADMIN') dbAccess.checked = true;
    });
});
</script>
{% endblock %}
