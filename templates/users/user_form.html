{% extends "base.html" %}
{% block title %}{{ title }} &middot; BOQ_AI{% endblock %}
{% block heading %}{{ title }}{% endblock %}

{% block content %}
<div class="panel panel--narrow">
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <label class="field">
            <span class="field__label">{{ field.label }}{% if field.field.required %}<span class="field__required" aria-hidden="true">*</span>{% endif %}</span>
            {% if field.name == "password1" or field.name == "password2" %}
            <div class="password-wrap">
                {{ field }}
                <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1" aria-label="Toggle password visibility">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>
            {% else %}
            {{ field }}
            {% endif %}
            {% for error in field.errors %}<span class="field__error">{{ error }}</span>{% endfor %}
            {% if field.help_text %}<span class="field__help">{{ field.help_text }}</span>{% endif %}
        </label>
        {% endfor %}
        <div class="form-actions">
            <a href="{% url 'users:list' %}" class="btn btn--ghost">Cancel</a>
            <button type="submit" class="btn btn--primary">Save</button>
        </div>
    </form>
</div>

<style>
.password-wrap { position: relative; }
.password-wrap .form-control { padding-right: 42px; }
.pwd-eye {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted, #64748b);
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .15s;
}
.pwd-eye:hover { color: var(--primary, #2563eb); }
</style>

<script>
function togglePwd(btn) {
    const wrap = btn.closest('.password-wrap');
    const input = wrap.querySelector('input');
    const open = btn.querySelector('.eye-open');
    const closed = btn.querySelector('.eye-closed');
    if (input.type === 'password') {
        input.type = 'text';
        open.style.display = 'none';
        closed.style.display = '';
    } else {
        input.type = 'password';
        open.style.display = '';
        closed.style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', function () {
    const role = document.querySelector('[name="role"]');
    const dbAccess = document.querySelector('[name="allow_db_access"]');
    if (!role || !dbAccess) return;

    const syncDbAccess = () => {
        const isAdmin = role.value === 'ADMIN';
        dbAccess.checked = isAdmin || dbAccess.checked;
        dbAccess.disabled = isAdmin;
    };

    syncDbAccess();
    role.addEventListener('change', syncDbAccess);
    dbAccess.closest('form')?.addEventListener('submit', () => {
        dbAccess.disabled = false;
        if (role.value === 'ADMIN') dbAccess.checked = true;
    });
});
</script>
{% endblock %}
