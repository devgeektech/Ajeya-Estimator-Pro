{% if run and job %}
<div id="proc-status"
     hx-get="{% url 'processing:status' run.pk %}"
     hx-swap="outerHTML"
    {% if job.status == 'QUEUED' or job.status == 'PROCESSING' %}hx-trigger="load, every 2s"{% endif %}>

    {% if job.status == 'COMPLETED' %}
    <script>setTimeout(() => window.location.reload(), 1000);</script>
    {% endif %}

    <div class="proc">
        <div class="proc__head">
            <span class="badge {% if job.status == 'COMPLETED' %}badge--green{% elif job.status == 'FAILED' %}badge--red{% elif job.status == 'PROCESSING' %}badge--orange{% elif job.status == 'QUEUED' %}badge--warn{% endif %}">
                {{ job.get_status_display }}
            </span>
            {% if job.message %}
            <span class="proc__msg">{{ job.message }}</span>
            {% endif %}
        </div>
        <div class="progress">
            <div class="progress__bar {% if job.status == 'FAILED' %}progress__bar--error{% endif %}"
                 style="width: {{ job.progress }}%;"></div>
        </div>
        <span class="proc__pct">{{ job.progress }}%</span>
    </div>
</div>
{% else %}
<div id="proc-status"></div>
{% endif %}
