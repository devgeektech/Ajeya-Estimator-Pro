{% extends "base.html" %}
{% block title %}Reset password &middot; Ajeya Estimator Pro{% endblock %}

{% block auth_content %}
<div class="auth">
    <div class="auth__card">
        <div class="auth__brand">
            <div class="auth__brand-name">
                <span class="brand-mark">Ajeya</span> <span class="brand-ai">Estimator Pro</span>
            </div>
            <p class="auth__brand-tagline">AI-Powered BOQ Estimation Platform</p>
        </div>
        <h1 class="auth__title">Reset password</h1>
        <p class="auth__subtitle">Enter your email and we'll send you a reset link.</p>

        <form method="post" novalidate id="password-reset-form">
            {% csrf_token %}
            <label class="field">
                <span class="field__label">Email{% if form.email.field.required %}<span class="field__required" aria-hidden="true">*</span>{% endif %}</span>
                {{ form.email }}
                {% for error in form.email.errors %}<span class="field__error">{{ error }}</span>{% endfor %}
            </label>
            <button type="submit" id="submit-btn" class="btn btn--primary btn--block">Send reset link</button>
        </form>

        <a class="auth__link" href="{% url 'accounts:login' %}">Back to sign in</a>
    </div>
</div>

<style>
@keyframes authSpin {
    to { transform: rotate(360deg); }
}
.btn--loading {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    opacity: 0.85 !important;
    cursor: wait !important;
    pointer-events: none !important;
}
.btn--loading svg {
    animation: authSpin 0.75s linear infinite;
    margin-right: 8px;
}
</style>

<script>
(function() {
    const form = document.getElementById('password-reset-form');
    if (form) {
        form.addEventListener('submit', function() {
            const btn = document.getElementById('submit-btn');
            if (btn && !btn.classList.contains('btn--loading')) {
                btn.classList.add('btn--loading');
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>Sending...';
                setTimeout(function() {
                    btn.disabled = true;
                }, 20);
            }
        });
    }
})();
</script>
{% endblock %}
