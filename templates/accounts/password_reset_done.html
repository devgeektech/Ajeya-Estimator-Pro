{% extends "base.html" %}
{% block title %}Check your email &middot; BOQ_AI{% endblock %}

{% block auth_content %}
<div class="auth">
    <div class="auth__card">
        <div class="auth__brand">
            <span class="brand-mark">BOQ</span><span class="brand-ai">AI</span>
        </div>
        <h1 class="auth__title">Check your email</h1>
        <p class="auth__subtitle">
            If an account exists for that address, we've sent password reset
            instructions. They should arrive shortly.
        </p>
        <a class="btn btn--primary btn--block" href="{% url 'accounts:login' %}">Back to sign in</a>
    </div>
</div>
{% endblock %}
