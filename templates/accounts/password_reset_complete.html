{% extends "base.html" %}
{% block title %}Password changed &middot; BOQ_AI{% endblock %}

{% block auth_content %}
<div class="auth">
    <div class="auth__card">
        <div class="auth__brand">
            <span class="brand-mark">BOQ</span><span class="brand-ai">AI</span>
        </div>
        <h1 class="auth__title">Password changed</h1>
        <p class="auth__subtitle">Your password has been updated. You can now sign in.</p>
        <a class="btn btn--primary btn--block" href="{% url 'accounts:login' %}">Sign in</a>
    </div>
</div>
{% endblock %}
